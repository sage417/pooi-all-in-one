version: "3"

# networks:
#   gitea:
#     external: false

services:
  server:
    image: gitea/gitea:1.25
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=gitea.pooi.app
      - GITEA__server__ROOT_URL=https://gitea.pooi.app
      - GITEA__server__SSH_PORT=222
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgresql:5432
      - GITEA__database__NAME=bitnami_gitea
      - GITEA__database__USER=bn_gitea
      - GITEA__database__PASSWD=
    restart: unless-stopped
    # networks:
    #   - gitea
    volumes:
      - ./gitea/data:/data
#      - ./gitea/custom/conf:/etc/gitea
#      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
          test: curl -fSs server:3000/api/healthz || exit 1
          start_period: 5s
          interval: 15s
          timeout: 5s
          retries: 3
    ports:
      - "127.0.0.1:3300:3000"
      - "222:22"

  postgresql:
    image: public.ecr.aws/bitnami/postgresql:17-debian-12
    container_name: postgresql
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_USERNAME=bn_gitea
      - POSTGRESQL_PASSWORD=
      - POSTGRESQL_POSTGRES_PASSWORD=
      - POSTGRESQL_DATABASE=bitnami_gitea
      - POSTGRESQL_TIMEZONE=Asia/Shanghai
      - POSTGRESQL_LOG_TIMEZONE=Asia/Shanghai
    volumes:
      - ./db:/bitnami/postgresql/data
    healthcheck:
      test: pg_isready --dbname='bitnami_gitea' --username='bn_gitea' || exit 1
      interval: 5s
      timeout: 2s
      retries: 2
      
  runner:
    image: gitea/act_runner:latest
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "${INSTANCE_URL}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "${RUNNER_NAME}"
      GITEA_RUNNER_LABELS: "${RUNNER_LABELS}"
    ports:
      - "127.0.0.1:8088:8088"
    restart: always
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./runner/config.yaml:/config.yaml
      - ./runner/data:/data
      - /var/run/docker.sock:/var/run/docker.sock